name: Windows and macOS compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  startup:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: PaperLens 中文 with spaces
    steps:
      - uses: actions/checkout@v7
        with:
          path: PaperLens 中文 with spaces
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: PaperLens 中文 with spaces/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
